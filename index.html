<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JPG to PNG Converter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }
    canvas {
      display: none;
    }
    #preview {
      max-width: 100%;
      height: auto;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <h2 class="mb-4">JPG to PNG Converter</h2>

    <input type="file" id="jpgInput" accept="image/jpeg" class="form-control mb-3" />

    <img id="preview" class="img-fluid mb-3" />

    <div class="d-grid gap-2">
      <button onclick="convertToPng()" class="btn btn-success">Convert to PNG</button>
      <a id="downloadLink" class="btn btn-primary" style="display: none;" download="converted.png">Download PNG</a>
    </div>

    <canvas id="canvas"></canvas>
  </div>

  <script>
    const input = document.getElementById('jpgInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const preview = document.getElementById('preview');
    const downloadLink = document.getElementById('downloadLink');
    let image = new Image();

    input.addEventListener('change', function () {
      const file = input.files[0];
      if (file && file.type === 'image/jpeg') {
        const reader = new FileReader();
        reader.onload = function (e) {
          image.onload = () => {
            preview.src = e.target.result;
          };
          image.src = e.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        alert("Please upload a valid JPG image.");
      }
    });

    function convertToPng() {
      if (!image.src) {
        alert("Please upload a JPG image first.");
        return;
      }

      canvas.width = image.width;
      canvas.height = image.height;
      ctx.drawImage(image, 0, 0);

      const pngUrl = canvas.toDataURL('image/png');
      downloadLink.href = pngUrl;
      downloadLink.style.display = 'block';
    }
  </script>
</body>
</html>
